# Render blueprint: one web service, one PostgreSQL database, one persistent disk for uploaded files.
databases:
  - name: eduhub-db
    plan: basic-256mb

services:
  - type: web
    name: eduhub
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/v1/health
    disk:
      name: eduhub-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: eduhub-db
          property: connectionString
      - key: APP_URL
        sync: false # e.g. https://eduhub.onrender.com
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_DIR
        value: /var/data/files
      - key: APP_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. EduHub <no-reply@your-domain>
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
